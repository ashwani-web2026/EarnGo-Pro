<!DOCTYPE html>
<html><head><meta name="viewport" content="width=device-width, initial-scale=1"><title>Dashboard - EarnGo Pro</title>
<style>
body{margin:0;font-family:Arial;background:#f5f7ff}
.header{background:#6c63ff;color:white;padding:15px;display:flex;justify-content:space-between}
.card{background:white;margin:15px;padding:15px;border-radius:12px;box-shadow:0 2px 10px #ddd}
.task{display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-bottom:1px solid #eee}
.btn{ background:#6c63ff;color:white;border:none;padding:8px 15px;border-radius:6px;cursor:pointer}
.refer-box{background:#eef0ff;border:1px dashed #6c63ff;padding:10px;border-radius:8px;margin-top:10px;word-break:break-all}
</style>
</head><body>
<div class="header"><b>EarnGo Pro</b><span onclick="location.href='wallet.html'">Wallet: ₹<span id="bal">0</span></span></div>

<div class="card"><h3>🔥 Daily Tasks</h3>
<div class="task"><span>Video Dekho (30 sec) - ₹5</span><button class="btn" onclick="earn(5)">Start</button></div>
<div class="task"><span>Greeting Share karo - ₹10</span><button class="btn" onclick="earn(10)">Start</button></div>
<div class="task"><span>App Install Task - ₹20</span><button class="btn" onclick="earn(20)">Start</button></div>
</div>

<div class="card"><h3>💰 Refer & Earn ₹40</h3>
<p>Har dost pe ₹40</p>
<div class="refer-box" id="reflink">https://earngo-pro.github.io?invite=AS1234</div>
<button class="btn" style="margin-top:10px" onclick="copyRef()">Copy Link</button>
</div>

<script>
let balance = parseInt(localStorage.getItem('bal')||'0');
document.getElementById('bal').innerText = balance;
function earn(amt){
  balance+=amt;
  localStorage.setItem('bal', balance);
  document.getElementById('bal').innerText = balance;
  alert("₹"+amt+" added! Wallet me check karo");
}
function copyRef(){
  navigator.clipboard.writeText(document.getElementById('reflink').innerText);
  alert("Referral Link Copied!");
}
</script>
</body></html>
