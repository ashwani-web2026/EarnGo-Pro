<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Login - EarnGo Pro</title>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
<style>body{margin:0;font-family:system-ui;background:#f4f5ff;display:flex;min-height:100vh;justify-content:center;align-items:center} .box{background:#fff;padding:30px;border-radius:16px;width:90%;max-width:380px;box-shadow:0 10px 30px rgba(0,0,0,.1)} input{width:100%;padding:13px;margin:8px 0;border:1px solid #ddd;border-radius:10px;box-sizing:border-box} .btn{background:#6c63ff;color:#fff;border:0;padding:14px;border-radius:10px;width:100%;font-weight:600;cursor:pointer;margin-top:10px} </style></head><body>
<div class="box"><h2>Login - Real OTP</h2><input id="mobile" placeholder="+919876543210"><div id="recaptcha"></div><button class="btn" onclick="sendOTP()">Send OTP</button><input id="otp" placeholder="OTP"><button class="btn" onclick="verifyOTP()">Login</button><p id="status"></p><p><a href="index.html">New? Signup</a></p></div>
<script>
const firebaseConfig = {
  apiKey: "AIzaSyDtzvRnHCR3P8DLhf-_xo_j-IhU9iaj7ro",
  authDomain: "earngo-pro-585df.firebaseapp.com",
  projectId: "earngo-pro-585df",
  storageBucket: "earngo-pro-585df.firebasestorage.app",
  messagingSenderId: "142206421543",
  appId: "1:142206421543:web:2dc72deaa16df67def1c02",
  measurementId: "G-T1RXK7ZHC7"
};
firebase.initializeApp(firebaseConfig); const auth=firebase.auth(); let confirmationResult;
window.onload=()=>{window.recaptchaVerifier=new firebase.auth.RecaptchaVerifier('recaptcha',{size:'normal'});};
function sendOTP(){let p=document.getElementById('mobile').value.trim(); auth.signInWithPhoneNumber(p, window.recaptchaVerifier).then(r=>{confirmationResult=r; document.getElementById('status').innerText="OTP Sent";}).catch(e=>alert(e.message));}
function verifyOTP(){let c=document.getElementById('otp').value.trim(); confirmationResult.confirm(c).then(res=>{localStorage.setItem('uid',res.user.uid); localStorage.setItem('phone',res.user.phoneNumber); location.href="dashboard.html";}).catch(e=>alert(e.message));}
</script></body></html>
