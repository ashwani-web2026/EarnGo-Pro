<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>EarnGo Pro - Real</title>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
<style>
body{margin:0;font-family:Arial;background:#f5f7ff;display:flex;min-height:100vh;flex-wrap:wrap}
.left{flex:1;background:#6c63ff;display:flex;align-items:center;justify-content:center;color:white;font-size:40px;font-weight:bold;min-width:300px;min-height:200px;text-align:center}
.right{flex:1;background:white;padding:30px;display:flex;flex-direction:column;justify-content:center;min-width:300px}
input{width:100%;padding:12px;margin:8px 0;border:1px solid #ddd;border-radius:8px;box-sizing:border-box}
.btn{background:#6c63ff;color:white;border:none;padding:14px;border-radius:8px;width:100%;font-size:16px;margin-top:10px;cursor:pointer}
.btn:disabled{background:#aaa}
</style>
</head>
<body>
<div class="left">EarnGo<br>Pro<br><span style="font-size:16px;font-weight:normal">REAL EARNING APP</span></div>
<div class="right">
<h2>Sign Up - REAL OTP</h2>
<input type="text" id="mobile" placeholder="+919876543210 (+91 lagana zaruri)">
<div id="recaptcha"></div>
<button class="btn" onclick="sendOTP()">Send Real OTP</button>
<input type="text" id="otp" placeholder="6 Digit OTP">
<input type="text" id="invite" placeholder="Invite Code (Optional)">
<button class="btn" onclick="verifyOTP()">Verify & Create Account</button>
<p id="status" style="color:green"></p>
</div>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyDtzvRnHCR3P8DLhf-_xo_j-IhU9iaj7ro",
  authDomain: "earngo-pro-585df.firebaseapp.com",
  projectId: "earngo-pro-585df",
  storageBucket: "earngo-pro-585df.firebasestorage.app",
  messagingSenderId: "142206421543",
  appId: "1:142206421543:web:2dc72deaa16df67def1c02",
  measurementId: "G-T1RXK7ZHC7"
};
firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db = firebase.firestore();
let confirmationResult;

window.onload = () => {
  window.recaptchaVerifier = new firebase.auth.RecaptchaVerifier('recaptcha', {
    'size': 'normal',
    'callback': () => {}
  });
}

function sendOTP(){
  let phone = document.getElementById('mobile').value.trim();
  if(!phone.startsWith('+')){alert("+91 ke saath likho, jaise +9198..."); return;}
  document.getElementById('status').innerText="Sending OTP...";
  auth.signInWithPhoneNumber(phone, window.recaptchaVerifier).then((result)=>{
    confirmationResult = result;
    document.getElementById('status').innerText="OTP sent to "+phone;
  }).catch((e)=>{alert("Error: "+e.message); console.log(e)});
}

function verifyOTP(){
  let code = document.getElementById('otp').value.trim();
  if(!confirmationResult){alert("Pehle OTP bhejo"); return;}
  confirmationResult.confirm(code).then((res)=>{
    let user = res.user;
    db.collection("users").doc(user.uid).set({
      mobile: user.phoneNumber,
      balance: 20, // signup bonus real
      inviteUsed: document.getElementById('invite').value || "",
      createdAt: firebase.firestore.FieldValue.serverTimestamp()
    }, {merge:true}).then(()=>{
      localStorage.setItem('uid', user.uid);
      localStorage.setItem('phone', user.phoneNumber);
      window.location.href="dashboard.html";
    });
  }).catch((e)=>{alert("Wrong OTP: "+e.message)});
}
</script>
</body>
</html>
